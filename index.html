<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iustinian's Cydia Repo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f3f3f3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    color:#222;
}

.card{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:22px;
    padding:35px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.icon{
    width:110px;
    height:110px;
    border-radius:24px;
    display:block;
    margin:0 auto 20px;
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    line-height:1.5;
    margin-bottom:30px;
}

.button{
    display:block;
    width:100%;
    padding:16px;
    margin-bottom:25px;
    background:#28a745;
    color:#fff;
    text-decoration:none;
    font-size:17px;
    font-weight:bold;
    border-radius:14px;
    transition:.2s;
}

.button:hover{
    background:#23913d;
}

.button:active{
    transform:scale(.98);
}

.repo-title{
    color:#888;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:10px;
}

.repo{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:14px;
    padding:18px;
    cursor:text;
    word-break:break-all;
    text-align:left;
    -webkit-user-select:text;
    user-select:text;
}

.repo code{
    font-family:Menlo,Consolas,monospace;
    font-size:14px;
    display:block;
    white-space:normal;
}

.helper{
    margin-top:12px;
    color:#888;
    font-size:14px;
}

#status{
    height:22px;
    margin-top:10px;
    color:#2ebf4f;
    font-weight:bold;
}

footer{
    margin-top:30px;
    color:#999;
    font-size:14px;
}

@media(max-width:500px){

.card{
    padding:24px;
}

.icon{
    width:90px;
    height:90px;
}

h1{
    font-size:27px;
}

.repo code{
    font-size:12px;
}

.button{
    font-size:16px;
}

}
</style>
</head>

<body>

<div class="card">

<img src="CydiaIcon.png" class="icon" alt="Repo Icon">

<h1>Iustinian's Repo</h1>

<p class="subtitle">
Themes, tweaks, utilities and jailbreak projects.
</p>

<a class="button"
href="cydia://url/https://cydia.saurik.com/api/share#?source=https://iustinian2013.github.io/cydia-repo/">
Add to Cydia
</a>

<div class="repo-title">
Repository
</div>

<div class="repo" id="repo" onclick="selectRepo()">
<code>https://iustinian2013.github.io/cydia-repo/</code>
</div>

<div class="helper">
Tap the repository to select it if the button above doesn't work.
</div>

<div id="status"></div>

<footer>
Made with ❤️ by Iustinian
</footer>

</div>

<script>
function selectRepo(){

    var element=document.getElementById("repo");

    if(document.body.createTextRange){

        var range=document.body.createTextRange();
        range.moveToElementText(element);
        range.select();

    }else if(window.getSelection){

        var selection=window.getSelection();
        var range=document.createRange();

        range.selectNodeContents(element);

        selection.removeAllRanges();
        selection.addRange(range);

    }

    document.getElementById("status").innerHTML="Selected!";

    setTimeout(function(){
        document.getElementById("status").innerHTML="";
    },2000);

}
</script>

</body>
</html>
