<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iustinian's Cydia Repo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 650px;
            padding: 40px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 10px 0;
        }

        p {
            color: #555;
        }

        .repo {
            margin-top: 25px;
            background: #efefef;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            font-family: monospace;
            transition: .2s;
        }

        .repo:hover {
            background: #dddddd;
        }

        #copied {
            color: #0a9b2a;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }

        footer {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">

    <img src="CydiaIcon.png" alt="Repo Icon">

    <h1>Iustinian's Cydia Repo</h1>

    <p>
        Custom tweaks, themes, utilities, and jailbreak projects.
    </p>

    <h3>Add this repo to Cydia</h3>

    <div class="repo" onclick="copyRepo()">
        https://iustinian2013.github.io/cydia-repo/
    </div>

    <div id="copied">
        ✅ Copied to clipboard!
    </div>

    <footer>
        Made with ❤️ by Iustinian
    </footer>

</div>

<script>
function copyRepo() {
    const repo = "https://iustinian2013.github.io/cydia-repo/";

    navigator.clipboard.writeText(repo).then(function () {
        const copied = document.getElementById("copied");
        copied.style.display = "block";

        setTimeout(function () {
            copied.style.display = "none";
        }, 2000);
    });
}
</script>

</body>
</html>
