<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iustinian's Cydia Repo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f3f3f3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    color:#222;
}

.card{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:22px;
    padding:35px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.icon{
    width:110px;
    height:110px;
    border-radius:24px;
    margin-bottom:20px;
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    margin-bottom:30px;
    line-height:1.5;
}

.repo-title{
    font-size:13px;
    color:#888;
    margin-bottom:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.repo-input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:14px;
    background:#fafafa;
    color:#222;
    font-family:Menlo,Consolas,monospace;
    font-size:14px;
    text-align:center;
    outline:none;
    transition:.2s;
}

.repo-input:focus{
    border-color:#999;
    background:#fff;
}

.helper{
    margin-top:10px;
    color:#888;
    font-size:14px;
}

footer{
    margin-top:30px;
    color:#999;
    font-size:14px;
}

@media(max-width:500px){

.card{
    padding:25px;
}

.icon{
    width:90px;
    height:90px;
}

h1{
    font-size:27px;
}

.repo-input{
    font-size:12px;
}

}
</style>
</head>

<body>

<div class="card">

<img src="CydiaIcon.png" class="icon" alt="Repo Icon">

<h1>Iustinian's Repo</h1>

<p class="subtitle">
Themes, tweaks, utilities and jailbreak projects.
</p>

<div class="repo-title">
Repository
</div>

<input
class="repo-input"
type="text"
value="https://iustinian2013.github.io/cydia-repo/"
readonly
onclick="this.focus();this.select();"
onfocus="this.select();">

<div class="helper">
Tap the URL to select it, then tap <b>Copy</b>.
</div>

<footer>
Made with ❤️ by Iustinian
</footer>

</div>

</body>
</html>
